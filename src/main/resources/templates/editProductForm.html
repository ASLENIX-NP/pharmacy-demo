<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Product | ABIS PLUS</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/sidebar-persistent.js}" defer></script></head>

</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{adminSidebar :: abis-sidebar}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3 d-flex align-items-center gap-2"
                data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
            <i class="bi bi-layout-sidebar"></i>
            <span>Sidebar</span>
        </button>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <!-- Form Card -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-success text-white border-0">
                            <h4 class="mb-0">
                                <i class="bi bi-person-plus me-2"></i>Add New User
                            </h4>
                        </div>

                        <div class="card-body p-4">
                            
                            <form th:action="@{/admin/product/edit}" method="post" class="needs-validation" th:object ="${product}"  novalidate>
                                
                                 <!-- brand name  Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label fw-semibold">Product Name *</label>
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="Enter product name" th:field="*{name}"  required>
                                        <div class="invalid-feedback">
                                            product name is required.
                                        </div>
                                    </div>
                                </div>

                                <!-- generic name  Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="genericName" class="form-label fw-semibold">Generic Name for product *</label>
                                        <input type="text" class="form-control" id="genericName" name="genericName"
                                               placeholder="Enter product Generic Name"  th:field="*{genericName}"  required>
                                        <div class="invalid-feedback">
                                            Generic name is required.
                                        </div>
                                    </div>
                                </div>

                                <!-- select category  Row -->
                                <div class="mb-3">
                                    <label for="category" class="form-label fw-semibold">Category *</label>
                                    <select class="form-select" id="category" name="category"  th:field="*{category}"   required>
                                        <option value="" selected disabled>-- Select a product --</option>
                                        <option th:each="c:${categories}" th:value = "${c.id}" >[[${c.categoryName}]]</option>

                                    </select>
                                    <div class="invalid-feedback">
                                        Please select a Category.
                                    </div>
                                </div>

                                <!-- rack location  Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="rackLocation" class="form-label fw-semibold">Rack Location *</label>
                                        <input type="text" class="form-control" id="rackLocation" name="rackLocation"
                                               placeholder="Enter product rack Location" th:field="*{rackLocation}"  required>
                                        <div class="invalid-feedback">
                                            rack Location is required.
                                        </div>
                                    </div>
                                </div>


                                <!-- min stock level  Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="minStockLevel" class="form-label fw-semibold">minimum stock Level *</label>
                                        <input type="number" class="form-control" id="minStockLevel" name="minStockLevel"
                                             step="1"  placeholder="Enter number of product received " th:field="*{minStockLevel}"  required>
                                        <div class="invalid-feedback">
                                            minimum  stock  is required.
                                        </div>
                                    </div>
                                </div>
                                


                                <!-- Buttons -->
                                <div class="d-grid gap-2 d-sm-flex justify-content-sm-between">
                                    <a th:href="@{/admin/inventory}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Back to Inventory
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-check-circle me-2"></i>Create Inventory Batch
                                    </button>
                                </div>

                                <input type="hidden" th:field="*{id}">
       
                            </form>
                        </div>
                    </div>

                    <!-- Help Text -->
                    <div class="alert alert-info mt-4 border-0">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>Note:</strong> All fields marked with * are required. Remaining stock will be auto updated.
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>

<!-- Form Validation Script -->
<script>
    (function() {
        'use strict';
        window.addEventListener('load', function() {
            let forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>

</body>
</html>
