<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar</title>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<div th:replace="~{header :: abis-navbar}"></div>

<aside th:fragment="abis-sidebar" class="bg-white border-end d-flex flex-column" style="width: 240px; min-height: calc(100vh - 65px);">
    <div class="nav nav-pills flex-column p-3 gap-2">
        <a th:href="@{/pharmacist/dashboard}"
           th:classappend="${currentPage == 'dashboard' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <i class="bi bi-speedometer2 me-3"></i>
            <span class="fw-semibold">Dashboard</span>
        </a>

        <a th:href="@{/pharmacist/newSales}"
           th:classappend="${currentPage == 'newSales' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <i class="bi bi-cart-plus me-3"></i>
            <span class="fw-semibold">New Sale (POS)</span>
        </a>

        <a th:href="@{/pharmacist/salesHistory}"
           th:classappend="${currentPage == 'salesHistory' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <i class="bi bi-receipt me-3"></i>
            <span class="fw-semibold">Sales History</span>
        </a>
    </div>
</aside>
<th:block th:insert = "~{footer.html}"></th:block>
</body>
</html>
