<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Active Pull Requests</title>
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/sidebar-persistent.js}" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='pullRequests')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        
        <!-- pages headders -->
        <div class="container-fluid mt-2">
            <div class="row g-4 mb-5 align-items-end"> 
                
                <!-- Left Column: Sidebar Button -->
                <div class="col-md-4 col-lg-4 d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 text-nowrap" data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
                        <i class="bi bi-layout-sidebar"></i>
                        <span>Sidebar</span>
                    </button>
                </div>

                 <!-- Center Column: Centered Dashboard Heading -->
                <div class="col-md-4 col-lg-4 d-flex justify-content-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left-right text-success fs-2"></i>
                        <h1 class="mb-0 text-nowrap fw-bold">Active Pull Requests</h1>
                    </div>
                </div>
                        
                
            </div>
        </div>

        <div class="container-fluid">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>
            <table id="pullRequestTable" class="table">
                <thead>
                <tr>
                    <th onclick="sortPullRequestTable(0)" style="cursor:pointer;">Batch ID</th>
                    <th onclick="sortPullRequestTable(1)" style="cursor:pointer;">Product Name</th>
                    <th onclick="sortPullRequestTable(2)" style="cursor:pointer;">Status</th>
                    <th onclick="sortPullRequestTable(3)" style="cursor:pointer;">Rack Location</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="batch : ${pullRequests}">
                    <td th:text="${batch.batchNumber}"></td>
                    <td th:text="${batch.product.name}"></td>
                    <td th:text="${batch.batchApprovalStatus.toString()}"></td>
                    <td th:text="${batch.product.rackLocation}"></td>
                    <td>
                        <form th:action="@{/storekeeper/pullRequests/confirm}" method="post">
                            <input type="hidden" name="batchId" th:value="${batch.id}" />
                            <button type="submit" class="btn btn-success">Confirm Physical Removal</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
<script>

    let pullRequestSort = {};

    function sortPullRequestTable(columnIndex) {

        const table = document.getElementById("pullRequestTable");
        const tbody = table.tBodies[0];
        const rows = Array.from(tbody.rows);

        pullRequestSort[columnIndex] = !pullRequestSort[columnIndex];

        rows.sort((a, b) => {

            let x = a.cells[columnIndex].innerText.trim();
            let y = b.cells[columnIndex].innerText.trim();

            let numX = parseFloat(x);
            let numY = parseFloat(y);

            if (!isNaN(numX) && !isNaN(numY)) {
                return pullRequestSort[columnIndex]
                    ? numX - numY
                    : numY - numX;
            }

            let dateX = Date.parse(x);
            let dateY = Date.parse(y);

            if (!isNaN(dateX) && !isNaN(dateY)) {
                return pullRequestSort[columnIndex]
                    ? dateX - dateY
                    : dateY - dateX;
            }

            return pullRequestSort[columnIndex]
                ? x.localeCompare(y)
                : y.localeCompare(x);

        });

        rows.forEach(row => tbody.appendChild(row));
    }

</script>
</body>
</html>
