<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Active Pull Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='pullRequests')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3 d-flex align-items-center gap-2"
                data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
            <i class="bi bi-layout-sidebar"></i>
            <span>Sidebar</span>
        </button>
        <div class="container-fluid">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>
            <h1>Active Pull Requests</h1>
            <table class="table">
                <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Product Name</th>
                    <th>Status</th>
                    <th>Rack Location</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="batch : ${pullRequests}">
                    <td th:text="${batch.batchNumber}"></td>
                    <td th:text="${batch.product.name}"></td>
                    <td th:text="${batch.batchApprovalStatus.toString()}"></td>
                    <td th:text="${batch.product.rackLocation}"></td>
                    <td>
                        <form th:action="@{/storekeeper/pullRequests/confirm}" method="post">
                            <input type="hidden" name="batchId" th:value="${batch.id}" />
                            <button type="submit" class="btn btn-success">Confirm Physical Removal</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
</body>
</html>
