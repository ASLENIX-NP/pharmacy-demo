<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product & Rack Locations</title>
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/sidebar-persistent.js}" defer></script></head>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='productsRacks')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
       
        <!-- pages headders -->
        <div class="container-fluid mt-2">
            <div class="row g-4 mb-5 align-items-end"> 
                
                <!-- Left Column: Sidebar Button -->
                <div class="col-md-4 col-lg-4 d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 text-nowrap" data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
                        <i class="bi bi-layout-sidebar"></i>
                        <span>Sidebar</span>
                    </button>
                </div>

                 <!-- Center Column: Centered Dashboard Heading -->
                <div class="col-md-4 col-lg-4 d-flex justify-content-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-grid-3x3-gap text-success fs-2"></i>
                        <h1 class="mb-0 text-nowrap fw-bold">Product & Rack Locations</h1>
                    </div>
                </div>
                        
                
            </div>
        </div>

        <div class="container-fluid">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Current Rack Location</th>
                    <th>Update Rack Location</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.rackLocation}"></td>
                    <td>
                        <form th:action="@{/storekeeper/productsRacks/edit}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}" />
                            <div class="input-group">
                                <input type="text" class="form-control" name="rackLocation" placeholder="Enter new rack">
                                <button type="submit" class="btn btn-primary"> Edit Rack</button>
                            </div>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
</body>
</html>
