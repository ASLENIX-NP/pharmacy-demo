<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>header</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<nav th:fragment="abis-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
    <div class="container-fluid px-4">
        <div class="d-flex w-100 justify-content-between align-items-center">
            
            <div id="userInfo" class="d-flex align-items-center flex-1" style="flex-basis: 0; flex-grow: 1;">
                <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                     style="width: 35px; height: 35px; font-size: 0.9rem; font-weight: 600; flex-shrink: 0;">
                    [[${session.activeUser.getInitials()}]]
                </div>
                <div class="d-none d-sm-block me-3">
                    <p class="mb-0 text-dark small fw-bold text-nowrap">[[${session.activeUser.getUsername()}]]</p>
                    <p class="mb-0 text-muted small" style="font-size: 0.75rem;">[[${session.activeUser.getRole()}]]</p>
                </div>
            </div>

            <div id="logo" class="d-flex justify-content-center">
                <a class="navbar-brand d-flex align-items-center mx-0" th:href="@{/dashboard}">
                    <img th:src="@{/images/AB+.svg}" alt="Logo" width="32" height="32" class="d-inline-block align-top me-2">
                    <span class="fw-bold tracking-tight text-dark">ABIS <span class="text-success">PLUS</span></span>
                </a>
            </div>

            <div id="setting" class="d-flex justify-content-end flex-1" style="flex-basis: 0; flex-grow: 1;">
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle shadow-none p-2" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear-fill text-secondary fs-5"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="navbarDropdown">
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/user/accountsettings}">
                                <i class="bi bi-person-gear me-2"></i> Account Settings
                            </a>
                        </li>
                        <li><hr class="dropdown-divider opacity-50"></li>
                        <li>
                            <form th:action="@{/logout}">
                                <button type="submit" class="dropdown-item py-2 text-danger fw-semibold w-100 text-start border-0 bg-transparent">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</nav>




</body>
</html>
