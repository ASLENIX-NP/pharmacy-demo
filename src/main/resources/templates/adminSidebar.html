<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>adminSidebar</title>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<div th:replace="~{header :: abis-navbar}"></div>

<aside th:fragment="abis-sidebar" class="bg-white border-end d-flex flex-column" style="width: 240px; min-height: calc(100vh - 65px);">
    <div class="nav nav-pills flex-column p-3 gap-2">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${currentPage == 'overview' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">📊</span>
            <span class="fw-semibold">Overview</span>
        </a>

        <a th:href="@{/admin/inventory}"
           th:classappend="${currentPage == 'inventory' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">📦</span>
            <span class="fw-semibold">Inventory</span>
        </a>

        <a th:href="@{/admin/logistics}"
           th:classappend="${currentPage == 'logistics' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">🤝</span>
            <span class="fw-semibold">Logistics</span>
        </a>

        <a th:href="@{/admin/users}"
           th:classappend="${currentPage == 'users' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">👥</span>
            <span class="fw-semibold">Users</span>
        </a>

        <a th:href="@{/admin/financials}"
           th:classappend="${currentPage == 'financials' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">📈</span>
            <span class="fw-semibold">Financials</span>
        </a>
    </div>
</aside>
<th:block th:insert = "~{footer.html}"></th:block>
</body>
</html>
