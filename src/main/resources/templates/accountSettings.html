<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Settings | ABIS PLUS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-person-gear me-2"></i>
                        Account Settings
                    </h3>

                </div>



                <div class="card-body p-4">

                    <form th:action="@{/user/accountsettings}" method="post">

                        <!-- Profile -->

                        <div class="text-center mb-4">

                            <div class="rounded-circle bg-success text-white d-inline-flex
                                        align-items-center justify-content-center"
                                 style="width:90px;height:90px;font-size:34px;font-weight:bold;">

                                <span th:text="${user.initials}">AB</span>

                            </div>

                            <h4 class="mt-3 mb-0"
                                th:text="${user.firstName + ' ' + user.lastName}">
                                User Name
                            </h4>

                            <span class="badge bg-success mt-2"
                                  th:text="${user.role}">
                                ADMIN
                            </span>

                        </div>

                        <hr>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">First Name</label>

                                <div class="input-group">

                                    <input
                                            id="firstName"
                                            type="text"
                                            class="form-control"
                                            name="firstName"
                                            th:value="${user.firstName}"
                                            readonly>

                                    <button
                                            type="button"
                                            class="btn btn-outline-success"
                                            onclick="enableFirstName()">

                                        <i class="bi bi-pencil-square"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">Last Name</label>

                                <div class="input-group">

                                    <input
                                            id="lastName"
                                            type="text"
                                            class="form-control"
                                            name="lastName"
                                            th:value="${user.lastName}"
                                            readonly>

                                    <button
                                            type="button"
                                            class="btn btn-outline-success"
                                            onclick="enableLastName()">

                                        <i class="bi bi-pencil-square"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:value="${user.username}"
                                        readonly>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Role
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:value="${user.role}"
                                        readonly>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                        type="email"
                                        class="form-control"
                                        th:value="${user.email}"
                                        readonly>

                            </div>



                        </div>

                        <hr>

                        <div class="mb-4">

                            <h5>
                                <i class="bi bi-shield-lock me-2"></i>
                                Security
                            </h5>

                            <div class="d-flex
                                        justify-content-between
                                        align-items-center">

                                <div>

                                    <strong>Password</strong>

                                    <p class="text-muted mb-0">
                                        **************
                                    </p>

                                </div>

                                <a th:href="@{/forgot-password}"
                                   class="btn btn-outline-primary">

                                    Change Password

                                </a>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">

                            <a href="/Dashboard"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                    id="saveBtn"
                                    class="btn btn-success"
                                    type="submit"
                                    style="display:none;">

                                <i class="bi bi-check-circle me-1"></i>

                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
</div>

<script>

    function enableFirstName(){

        document.getElementById("firstName").removeAttribute("readonly");

        document.getElementById("saveBtn").style.display = "inline-block";

        document.getElementById("firstName").focus();
    }

    function enableLastName(){

        document.getElementById("lastName").removeAttribute("readonly");

        document.getElementById("saveBtn").style.display = "inline-block";

        document.getElementById("lastName").focus();
    }

</script>

</body>
</html>
