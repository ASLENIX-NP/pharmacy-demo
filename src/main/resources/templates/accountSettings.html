<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Settings | ABIS PLUS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="bi bi-person-gear me-2"></i>
                        Account Settings
                    </h3>
                    
                    <!-- Thymeleaf static/relative link -->
                    <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>                                  


                <div class="card-body p-4">

                    <!-- Profile -->
                    <div class="text-center mb-4">

                        <div class="rounded-circle bg-success text-white d-inline-flex
                                    align-items-center justify-content-center"
                             style="width:90px;height:90px;font-size:34px;font-weight:bold;">

                            <span th:text="${user.initials}">AB</span>

                        </div>

                        <h4 class="mt-3 mb-0"
                            th:text="${user.firstName + ' ' + user.lastName}">
                            User Name
                        </h4>

                        <span class="badge mt-2" th:classappend="${user.role.getColour()}"
                              th:text="${user.role}">
                            ADMIN
                        </span>

                    </div>

                    <hr>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label text-muted mb-1">First Name</label>
                            <div class="form-control bg-light" th:text="${user.firstName}">First Name</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted mb-1">Last Name</label>
                            <div class="form-control bg-light" th:text="${user.lastName}">Last Name</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted mb-1">Username</label>
                            <div class="form-control bg-light" th:text="${user.username}">Username</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted mb-1">Role</label>
                            <div class="form-control bg-light" th:text="${user.role}">ADMIN</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted mb-1">Email</label>
                            <div class="form-control bg-light" th:text="${user.email}">email@example.com</div>
                        </div>

                    </div>
                    <br>

                    <div class="d-flex justify-content-end gap-2">

                        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                            <i class="bi bi-pencil-square me-1"></i>
                            Edit Profile
                        </button>

                    </div>

                    <hr>

                    <div class="mb-4">
                        <h5 class="mb-3">Security</h5>

                        <form th:action="@{/password/change}" method="get" class="d-inline">
                            <button type="submit" class="btn btn-primary btn-sm">
                                Change Password
                            </button>
                        </form>
                    </div>


                </div>

            </div>

        </div>

    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
            <form th:action="@{/user/edit}" method="post">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" name="id" th:value="${user.id}">

                    <div class="mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" id="firstName" name="firstName" class="form-control" th:value="${user.firstName}" required>
                    </div>

                    <div class="mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" id="lastName" name="lastName" class="form-control" th:value="${user.lastName}" required>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 p-3 border-top bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
