<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Storekeeper Dashboard | ABIS PLUS</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='dashboard')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3 d-flex align-items-center gap-2"
                data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
            <i class="bi bi-layout-sidebar"></i>
            <span>Sidebar</span>
        </button>

        <div class="container-fluid">
            <h1>Storekeeper Dashboard</h1>
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Total Batch Count</h5>
                            <p class="card-text" th:text="${stats.totalBatches}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Expected Delivery</h5>
                            <p class="card-text" th:text="${stats.remainingDelivery}"></p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body" style="color: #ff0000;">
                            <h5 class="card-title" style="color: #ff0000;">Pull Requests</h5>
                            <p class="card-text " style="color: #ff0000;" th:text="${stats.pendingTasks}"></p>                        </div>
                    </div>
                </div>


            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
</body>
</html>
