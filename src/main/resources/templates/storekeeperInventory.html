<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Stock Ledger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/sidebar-persistent.js}" defer></script></head>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='inventory')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
       
        <!-- pages headders -->
        <div class="container-fluid mt-2">
            <div class="row g-4 mb-5 align-items-end"> 
                
                <!-- Left Column: Sidebar Button -->
                <div class="col-md-4 col-lg-4 d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 text-nowrap" data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
                        <i class="bi bi-layout-sidebar"></i>
                        <span>Sidebar</span>
                    </button>
                </div>

                 <!-- Center Column: Centered Dashboard Heading -->
                <div class="col-md-4 col-lg-4 d-flex justify-content-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-activity text-success fs-2"></i>
                        <h1 class="mb-0 text-nowrap fw-bold">Live Stock Ledger</h1>
                    </div>
                </div>
                        
                
            </div>
        </div>


        <div class="container-fluid">

             <!-- Display Success Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <strong>Success!</strong> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Display Error Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <strong>Error!</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
               <a th:href="@{/storekeeper/inventory/add}" class="btn btn-success">
                            <i class="bi bi-plus-circle me-2"></i> Add Inventory
                        </a>
            <table id="liveInventoryTable" class="table">
                <thead>
                <tr>
                    <th onclick="sortLiveInventoryTable(0)" style="cursor:pointer;">Batch ID</th>
                    <th onclick="sortLiveInventoryTable(1)" style="cursor:pointer;">Product Name</th>
                    <th onclick="sortLiveInventoryTable(2)" style="cursor:pointer;">Expiry Date</th>
                    <th onclick="sortLiveInventoryTable(3)" style="cursor:pointer;">Quantity</th>
                    <th onclick="sortLiveInventoryTable(4)" style="cursor:pointer;">Status</th>
                    <th onclick="sortLiveInventoryTable(5)" style="cursor:pointer;">Zone</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="batch : ${inventoryBatches}">
                    <td th:text="${batch.id}"></td>
                    <td th:text="${batch.product.name}"></td>
                    <td th:text="${batch.expiryDate}"></td>
                    <td th:text="${batch.quantityReceived}"></td>
                    <td><span th:text="${batch.batchApprovalStatus}" class="badge" th:classappend="${batch.batchApprovalStatus.getColour()}"></span> </td>
                    <td><span th:text="${batch.storageZone}" class="badge" th:classappend="${batch.storageZone.getColour()}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
<script>

    let liveInventorySort = {};

    function sortLiveInventoryTable(columnIndex) {

        const table = document.getElementById("liveInventoryTable");
        const tbody = table.tBodies[0];
        const rows = Array.from(tbody.rows);

        liveInventorySort[columnIndex] = !liveInventorySort[columnIndex];

        rows.sort((a, b) => {

            let x = a.cells[columnIndex].innerText.trim();
            let y = b.cells[columnIndex].innerText.trim();

            // Number sorting
            let numX = parseFloat(x);
            let numY = parseFloat(y);

            if (!isNaN(numX) && !isNaN(numY)) {
                return liveInventorySort[columnIndex]
                    ? numX - numY
                    : numY - numX;
            }

            // Date sorting
            let dateX = Date.parse(x);
            let dateY = Date.parse(y);

            if (!isNaN(dateX) && !isNaN(dateY)) {
                return liveInventorySort[columnIndex]
                    ? dateX - dateY
                    : dateY - dateX;
            }

            // Text sorting
            return liveInventorySort[columnIndex]
                ? x.localeCompare(y)
                : y.localeCompare(x);

        });

        rows.forEach(row => tbody.appendChild(row));
    }

</script>
</body>
</html>
