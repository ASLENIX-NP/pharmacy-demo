<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Stock Ledger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='inventory')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3 d-flex align-items-center gap-2"
                data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
            <i class="bi bi-layout-sidebar"></i>
            <span>Sidebar</span>
        </button>




        <div class="container-fluid">
            <h1>Live Stock Ledger</h1>


             <!-- Display Success Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <strong>Success!</strong> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Display Error Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <strong>Error!</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
               <a th:href="@{/storekeeper/inventory/add}" class="btn btn-success">
                            <i class="bi bi-plus-circle me-2"></i> Add Inventory
                        </a>
            <table class="table">
                <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Product Name</th>
                    <th>Expiry Date</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Zone</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="batch : ${inventoryBatches}">
                    <td th:text="${batch.id}"></td>
                    <td th:text="${batch.product.name}"></td>
                    <td th:text="${batch.expiryDate}"></td>
                    <td th:text="${batch.quantityReceived}"></td>
                    <td><span th:text="${batch.batchApprovalStatus}" class="badge" th:classappend="${batch.batchApprovalStatus.getColour()}"></span> </td>
                    <td><span th:text="${batch.storageZone}" class="badge" th:classappend="${batch.storageZone.getColour()}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
</body>
</html>
