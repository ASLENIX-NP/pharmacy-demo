<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Active Pull Requests</title>
    <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/sidebar-persistent.js}" defer></script></head>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{storekeeperSidebar :: abis-sidebar(currentPage='orderDeliver')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <!-- pages headders -->
        <div class="container-fluid mt-2">
            <div class="row g-4 mb-5 align-items-end"> 
                
                <!-- Left Column: Sidebar Button -->
                <div class="col-md-4 col-lg-4 d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 text-nowrap" data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
                        <i class="bi bi-layout-sidebar"></i>
                        <span>Sidebar</span>
                    </button>
                </div>

                 <!-- Center Column: Centered Dashboard Heading -->
                <div class="col-md-4 col-lg-4 d-flex justify-content-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-box-arrow-in-down text-success fs-2"></i>
                        <h1 class="mb-0 text-nowrap fw-bold">Incoming Delivery</h1>
                    </div>
                </div>
                        
                
            </div>
        </div>  
      
        <div class="container-fluid">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>

            <table id="deliveryTable" class="table">
                <thead>
                <tr>
                    <th onclick="sortDeliveryTable(0)" style="cursor:pointer;">Purchase ID</th>
                    <th onclick="sortDeliveryTable(1)" style="cursor:pointer;">Bill Number</th>
                    <th onclick="sortDeliveryTable(2)" style="cursor:pointer;">Company</th>
                    <th onclick="sortDeliveryTable(3)" style="cursor:pointer;">Amount</th>
                    <th onclick="sortDeliveryTable(4)" style="cursor:pointer;">Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${purchaseOrder}">
                    <td th:text="${order.purchaseNumber}"></td>
                    <td th:text="${order.billNumber}"></td>
                    <td th:text="${order.supplier.companyName}"></td>
                    <td th:text="${order.grandTotal}"></td>
                    <td><span th:text="${order.paymentStatus.getValue()}" class="badge" th:classappend="${order.paymentStatus.getColour()}"></span> </td>

                    <td>
                        <form th:action="@{/storekeeper/orderDeliver}" method="post">
                            <input type="hidden" name="orderId" th:value="${order.id}" />
                            <button type="submit" class="btn btn-success">Confirm Delivery</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
<script>

    let deliverySort = {};

    function sortDeliveryTable(columnIndex) {

        const table = document.getElementById("deliveryTable");
        const tbody = table.tBodies[0];
        const rows = Array.from(tbody.rows);

        deliverySort[columnIndex] = !deliverySort[columnIndex];

        rows.sort((a, b) => {

            let x = a.cells[columnIndex].innerText.trim();
            let y = b.cells[columnIndex].innerText.trim();

            // Numeric sorting
            let numX = parseFloat(x.replace(/,/g, ""));
            let numY = parseFloat(y.replace(/,/g, ""));

            if (!isNaN(numX) && !isNaN(numY)) {
                return deliverySort[columnIndex]
                    ? numX - numY
                    : numY - numX;
            }

            // Date sorting (kept for consistency if you later add a date column)
            let dateX = Date.parse(x);
            let dateY = Date.parse(y);

            if (!isNaN(dateX) && !isNaN(dateY)) {
                return deliverySort[columnIndex]
                    ? dateX - dateY
                    : dateY - dateX;
            }

            // Text sorting
            return deliverySort[columnIndex]
                ? x.localeCompare(y)
                : y.localeCompare(x);

        });

        rows.forEach(row => tbody.appendChild(row));
    }

</script>
</body>
</html>
