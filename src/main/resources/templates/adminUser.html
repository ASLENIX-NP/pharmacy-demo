<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users | ABIS PLUS</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/sidebar-persistent.js}" defer></script></head>

</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{adminSidebar :: abis-sidebar(currentPage='users')}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">

		<!-- pages headders -->
        <div class="container-fluid mt-2">
            <div class="row g-4 mb-5 align-items-end"> 
                
                <!-- Left Column: Sidebar Button -->
                <div class="col-md-4 col-lg-4 d-flex align-items-center">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 text-nowrap" data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
                        <i class="bi bi-layout-sidebar"></i>
                        <span>Sidebar</span>
                    </button>
                </div>

                 <!-- Center Column: Centered Dashboard Heading -->
                <div class="col-md-4 col-lg-4 d-flex justify-content-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-people text-success fs-2"></i>
                        <h1 class="mb-0 text-nowrap fw-bold">User Management</h1>
                    </div>
                </div>
                        
                
            </div>
        </div>

        <div class="container-fluid">
           
            <!-- Display Success Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <strong>Success!</strong> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Display Error Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <strong>Error!</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2 mb-4">
                <a th:href="@{/admin/users/add}" class="btn btn-success">
                    <i class="bi bi-person-plus me-2"></i>Add New User
                </a>
                <form th:action="@{/admin/user/export}" th:method="get" target="_blank" style="display: inline;">
                    <button type="submit"
                            class="btn btn-outline-secondary"
                            id="exportUserExcelBtn"
                            aria-label="Export User Excel">
                        <i class="bi bi-download me-2"></i>Export Users
                    </button>
                </form>
            </div>

            <!-- Users Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table id="userTable" class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th onclick="sortUserTable(0)" style="cursor:pointer;">User ID</th>
                                <th onclick="sortUserTable(1)" style="cursor:pointer;">User Name</th>
                                <th onclick="sortUserTable(2)" style="cursor:pointer;">Role</th>
                                <th onclick="sortUserTable(3)" style="cursor:pointer;">Email</th>
                                <th onclick="sortUserTable(4)" style="cursor:pointer;">Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                                <tr th:each = "u:${users}">

                                    <td>[[${u.id}]]</td>
                                    <td><span class="fw-semibold">[[${u.username}]]</span></td>

                                    <td><span class="badge" th:classappend="${u.role.getColour()}">[[${u.role.getValue()}]]</span></td>
                                    <td>[[${u.email}]]</td>
                                    <td><span class="badge" th:classappend="${u.status.getColour()}">[[${u.status.getValue()}]]</span></td>
                                    <td>
                                        <a th:href="@{/admin/user/edit(id = ${u.id})}">
                                            <input type="submit" value="Edit" class="btn btn-sm btn-outline-primary"></a>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>
<script>

    let userSort = {};

    function sortUserTable(columnIndex) {

        const table = document.getElementById("userTable");
        const tbody = table.tBodies[0];
        const rows = Array.from(tbody.rows);

        userSort[columnIndex] = !userSort[columnIndex];

        rows.sort((a, b) => {

            let x = a.cells[columnIndex].innerText.trim();
            let y = b.cells[columnIndex].innerText.trim();

            let numX = parseFloat(x);
            let numY = parseFloat(y);

            if (!isNaN(numX) && !isNaN(numY)) {
                return userSort[columnIndex]
                    ? numX - numY
                    : numY - numX;
            }

            return userSort[columnIndex]
                ? x.localeCompare(y)
                : y.localeCompare(x);

        });

        rows.forEach(row => tbody.appendChild(row));
    }

</script>

</body>
</html>
