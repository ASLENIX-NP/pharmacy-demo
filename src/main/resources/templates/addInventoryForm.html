<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Inventory | ABIS PLUS</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Header -->
<div th:replace="~{header :: abis-navbar}"></div>

<div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebarWrapper" class="collapse collapse-horizontal show border-end bg-white">
        <div th:replace="~{adminSidebar :: abis-sidebar}"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3 d-flex align-items-center gap-2"
                data-bs-toggle="collapse" data-bs-target="#sidebarWrapper">
            <i class="bi bi-layout-sidebar"></i>
            <span>Sidebar</span>
        </button>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <!-- Form Card -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-success text-white border-0">
                            <h4 class="mb-0">
                                <i class="bi bi-archive-fill me-2"></i>Create New Batch
                            </h4>
                        </div>

                        <div class="card-body p-4">
                            
                            <form th:action="@{/admin/inventory/add}" method="post" class="needs-validation" novalidate>
                                
                                
                                <!-- select product  Row -->
                                <div class="mb-3">
                                    <label for="product" class="form-label fw-semibold">Product *</label>
                                    <select class="form-select" id="product" name="product"    required>
                                        <option value="" selected disabled>-- Select a product --</option>
                                        <option th:each="p:${products}" th:value = "${p.id}" >[[${p.name}]]
                                            <br>[[${p.genericName}]]</option>

                                    </select>
                                    <div class="invalid-feedback">
                                        Please select a product.
                                    </div>
                                </div>

                                <!-- select supplier  Row -->
                                <div class="mb-3">
                                    <label for="purchaseOrder" class="form-label fw-semibold">Purchase Order Number
                                        *</label>
                                    <select class="form-select" id="purchaseOrder" name="purchaseOrder"    required>
                                        <option value="" selected disabled>-- Select a Purchase Order --</option>
                                        <option th:each="po:${purchaseOrder}" th:value = "${po.id}" >[[${po.purchaseNumber}]]</option>

                                    </select>
                                    <div class="invalid-feedback">
                                        Please select a purchaseOrder.
                                    </div>
                                </div>



                                <!-- quantity received  Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="quantityReceived" class="form-label fw-semibold">Quantity *</label>
                                        <input type="number" class="form-control" id="quantityReceived" name="quantityReceived"
                                               placeholder="Enter number of product received "  step="1" required>
                                        <div class="invalid-feedback">
                                            Quantity of  is Received.
                                        </div>
                                    </div>
                                </div>

                                <!-- cost price   Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="costPrice" class="form-label fw-semibold">Cost Price *</label>
                                        <input type="number" class="form-control" id="costPrice" name="costPrice"
                                              step="0.01" placeholder="Enter cost price "  required>
                                        <div class="invalid-feedback">
                                            cost price is required.
                                        </div>
                                    </div>
                                </div>

                                <!-- selling price   Row -->

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="sellingPrice" class="form-label fw-semibold">selling Price *</label>
                                        <input type="number" class="form-control" id="sellingPrice" name="sellingPrice"
                                              step="0.01" placeholder="Enter selling price "  required>
                                        <div class="invalid-feedback">
                                            selling price is required.
                                        </div>
                                    </div>
                                </div>

                                <!-- Expiry Date Row -->
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="expiryDate" class="form-label fw-semibold">Expiry Date *</label>
                                        <input type="date" class="form-control" id="expiryDate" name="expiryDate" required>
                                        <div class="invalid-feedback">
                                            Expiry Date is required.
                                        </div>
                                    </div>
                                </div>

                                


                                <!-- Buttons -->
                                <div class="d-grid gap-2 d-sm-flex justify-content-sm-between">
                                    <a th:href="@{/admin/inventory}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Back to Inventory
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-check-circle me-2"></i>Create Inventory Batch
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Help Text -->
                    <div class="alert alert-info mt-4 border-0">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>Note:</strong> All fields marked with * are required. Remaining stock will be auto updated.
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<div th:replace="~{footer :: abis-footer}"></div>

<!-- Form Validation Script -->
<script>
    (function() {
        'use strict';
        window.addEventListener('load', function() {
            let forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>

</body>
</html>
