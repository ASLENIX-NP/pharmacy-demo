<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="abis-shell d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card abis-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img th:src="@{/images/AB+.svg}" alt="ABIS PLUS Logo" class="abis-logo mb-3">
                            <h1 class="abis-title h3 fw-bold mb-1">Forgot Password</h1>
                            <p class="text-secondary mb-0 small">Enter your email address to request a password reset link.</p>
                        </div>

                        <div th:if="${success}">
                            <div class="alert alert-success border-0 rounded-4" role="alert">
                                    [[${success}]]
                            </div>
                            
                            <div class="text-center mt-4 mb-3">
                                <p class="text-secondary small mb-2">Didn't get the link?</p>
                                <form action="/forgot-password" method="post" id="resendForm">
                                    <input type="hidden" name="email" th:value="${email}">
                                    <button type="submit" id="resendBtn" class="btn btn-sm btn-outline-success" disabled>
                                        Resend link <span id="timerText">in <span id="timer">02:00</span></span>
                                    </button>
                                </form>
                            </div>
                            
                            <script>
                                let timeLeft = 120; // 2 minutes
                                const timerEl = document.getElementById('timer');
                                const timerTextEl = document.getElementById('timerText');
                                const resendBtn = document.getElementById('resendBtn');
                                
                                const countdown = setInterval(() => {
                                    timeLeft--;
                                    let minutes = Math.floor(timeLeft / 60);
                                    let seconds = timeLeft % 60;
                                    
                                    if (seconds < 10) seconds = '0' + seconds;
                                    timerEl.textContent = '0' + minutes + ':' + seconds;
                                    
                                    if (timeLeft <= 0) {
                                        clearInterval(countdown);
                                        resendBtn.disabled = false;
                                        timerTextEl.style.display = 'none';
                                        resendBtn.textContent = 'Resend link';
                                    }
                                }, 1000);
                            </script>
                        </div>
                        
                        <div th:unless="${success}">
                            <div th:if="${error}" class="alert alert-danger border-0 rounded-4" role="alert">
                                    [[${error}]]
                            </div>

                            <form action="/forgot-password" method="post" class="needs-validation">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Email Address</label>
                                    <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            class="form-control"
                                            placeholder="Enter your email"
                                            required>
                                </div>

                                <button type="submit" class="btn btn-abis btn-success w-100 mt-4">
                                    Send Reset Link
                                </button>
                            </form>
                        </div>

                        <a th:href="@{/login}" class="forgot-link small d-block text-center mt-3">Back to Login</a>

                        <p class="text-center text-secondary small mt-4 mb-0">
                            Secure access for pharmacy operations, billing, and inventory control.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:insert="~{footer.html}"></th:block>

</body>
</html>
