<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="abis-shell d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card abis-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img th:src="@{images/AB+.svg}" alt="ABIS PLUS Logo" class="abis-logo mb-3">
                            <h1 class="abis-title h3 fw-bold mb-1">ABIS PLUS</h1>
                            <p class="text-secondary mb-0 small">Accounting, Billing Inventory Management System </p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger border-0 rounded-4" role="alert">
                                [[${error}]]
                        </div>

                        <form action="/login"  method="post" class="needs-validation">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input
                                        type="text"
                                        id="username"
                                        name="username"
                                        class="form-control no-spinners"
                                        placeholder="Enter your username"
                                        required>
                            </div>

                            <div class="mb-2">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label for="password" class="form-label fw-semibold mb-0">Password</label>
                                </div>
                                <input type="password" id="password" name="password" class="form-control"
                                        placeholder="Enter your password"
                                        autocomplete="current-password"
                                        required>
                            </div>

                            <button type="submit" class="btn btn-abis btn-success w-100 mt-4">
                                Login
                            </button>
                        </form>

                        <a href="#" class="forgot-link small d-block text-center mt-2">Forgot password?</a>

                        <p class="text-center text-secondary small mt-4 mb-0">
                            Secure access for pharmacy operations, billing, and inventory control.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:insert = "~{footer.html}"></th:block>

</body>
</html>
