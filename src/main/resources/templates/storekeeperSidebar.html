<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>storekeeperSidebar</title>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div th:replace="~{header :: abis-navbar}"></div>

<aside th:fragment="abis-sidebar" class="bg-white border-end d-flex flex-column" style="width: 240px; min-height: calc(100vh - 65px);">
    <div class="nav nav-pills flex-column p-3 gap-2">
        <a th:href="@{/storekeeper/dashboard}"
           th:classappend="${currentPage == 'dashboard' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">📊</span>
            <span class="fw-semibold">Dashboard</span>
        </a>

        <a th:href="@{/storekeeper/inventory}"
           th:classappend="${currentPage == 'inventory' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">📋</span>
            <span class="fw-semibold">Live  Inventory</span>
        </a>

        <a th:href="@{/storekeeper/productsRacks}"
           th:classappend="${currentPage == 'productsRacks' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">🏷️</span>
            <span class="fw-semibold">Product Locations</span>
        </a>

        <a th:href="@{/storekeeper/pullRequests}"
           th:classappend="${currentPage == 'pullRequests' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center justify-content-between py-2 px-3 rounded-3">
            <div class="d-flex align-items-center">
                <span class="me-3">⚠️</span>
                <span class="fw-semibold">Active Pull Requests</span>
            </div>
            <span th:if="${pullRequestCount > 0}" class="badge bg-warning text-dark" th:text="${pullRequestCount}"></span>
        </a>

         <a th:href="@{/storekeeper/orderDeliver}"
           th:classappend="${currentPage == 'orderDeliver' ? 'active bg-success shadow-sm' : 'link-dark'}"
           class="nav-link d-flex align-items-center py-2 px-3 rounded-3">
            <span class="me-3">🚙</span>
            <span class="fw-semibold">Conform Delivery</span>
        </a>
    </div>
</aside>
<th:block th:insert = "~{footer.html}"></th:block>
</body>
</html>
