<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>footer</title>

  <!-- Latest compiled and minified CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Latest compiled JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<footer th:fragment="abis-footer" class="border-top bg-light py-2 mt-auto">
    <div class="container-fluid px-4">
        <div class="row align-items-center small text-secondary">
            <!-- Left: App Version & Copyright -->
            <div class="col-12 col-md-4 text-center text-md-start mb-2 mb-md-0">
                <span class="fw-bold text-dark">ABIS PLUS</span>
                <span class="mx-2 border-end pe-2 text-muted">v1.0.0</span>
                <span>copyright © ; 2026 ABIS PLUS </span>
            </div>

            <!-- Center: System Status Indicator -->
            <div class="col-12 col-md-4 text-center mb-2 mb-md-0">
                <div class="d-inline-flex align-items-center bg-white border rounded-pill px-3 py-1 shadow-sm">
                    <span class="bg-success rounded-circle d-inline-block me-2"
                          style="width: 8px; height: 8px; box-shadow: 0 0 4px #198754;"></span>
                    <span class="fw-medium">System Online & Synced</span>
                </div>
            </div>

            <!-- Right: Support Links -->
            <div class="col-12 col-md-4 text-center text-md-end">
                <a href="#" class="text-secondary text-decoration-none me-3 border-end pe-3">Knowledge Base</a>
                <a href="#" class="text-secondary text-decoration-none text-danger-hover">Report a Bug</a>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
