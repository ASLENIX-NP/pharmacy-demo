<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="abis-shell d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card abis-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img th:src="@{/images/AB+.svg}" alt="ABIS PLUS Logo" class="abis-logo mb-3">
                            <h1 class="abis-title h3 fw-bold mb-1">Set Password</h1>
                            <p class="text-secondary mb-0 small">Please create a new password to activate your account</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger border-0 rounded-4" role="alert">
                                [[${error}]]
                        </div>

                        <form action="/set-password" method="post" class="needs-validation">
                            <input type="hidden" name="token" th:value="${token}">
                            
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">New Password</label>
                                <div class="position-relative">
                                    <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            class="form-control pe-5"
                                            placeholder="Enter new password"
                                            required>
                                    <button class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted toggle-password" type="button" data-target="password" style="z-index: 5;">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold mb-0">Confirm Password</label>
                                <div class="position-relative mt-2">
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control pe-5"
                                            placeholder="Confirm your new password"
                                            required>
                                    <button class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none text-muted toggle-password" type="button" data-target="confirmPassword" style="z-index: 5;">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-abis btn-success w-100 mt-4">
                                Change Password
                            </button>
                        </form>

                        <p class="text-center text-secondary small mt-4 mb-0">
                            Secure access for pharmacy operations, billing, and inventory control.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:insert="~{footer.html}"></th:block>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match. Please try again.');
        }
    });

    document.querySelectorAll('.toggle-password').forEach(function(button) {
        button.addEventListener('click', function() {
            var targetId = this.getAttribute('data-target');
            var input = document.getElementById(targetId);
            var icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });
</script>
</body>
</html>
