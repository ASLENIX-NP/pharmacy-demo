<!-- Invoices List -->
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="accordion" id="invoicesAccordion">
            
            <!-- Dynamic Invoice Items -->
            <div th:each="invoice, iterStat : ${invoices}" class="accordion-item border-bottom mb-2">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                            th:data-bs-target="|#invoice${iterStat.index}|">
                        <div class="row w-100 g-3 align-items-center">
                            <div class="col-md-2">
                                <strong class="text-primary" th:text="|#${invoice.id}|"></strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted d-block">Pharmacist</small>
                                <span th:text="${invoice.pharmacist.name}">N/A</span>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted d-block">Customer</small>
                                <span th:text="${invoice.customer.name}">N/A</span>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted d-block">Date</small>
                                <span th:text="${#dates.format(invoice.transactionDate, 'yyyy-MM-dd')}">N/A</span>
                            </div>
                            <div class="col-md-2">
                                <span th:classappend="${invoice.paymentStatus == 'PAID' ? 'bg-success' : 'bg-warning'}" 
                                      class="badge" th:text="${invoice.paymentStatus}">Status</span>
                            </div>
                            <div class="col-md-2 text-end">
                                <strong class="text-success" th:text="|$${invoice.totalAmount}|"></strong>
                            </div>
                        </div>
                    </button>
                </h2>
                <div th:id="|invoice${iterStat.index}|" class="accordion-collapse collapse" data-bs-parent="#invoicesAccordion">
                    <div class="accordion-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th>Product</th>
                                    <th>Batch</th>
                                    <th>Quantity</th>
                                    <th>Unit Price</th>
                                    <th>Discount %</th>
                                    <th>VAT %</th>
                                    <th>Total Amount</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${invoice.invoiceItems}">
                                    <td>
                                        <span class="badge bg-light text-dark" th:text="${item.product.name}"></span>
                                    </td>
                                    <td>
                                        <span class="text-muted" th:text="${item.batch.batchNumber}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${item.quantity}"></span>
                                    </td>
                                    <td th:text="|$${item.unitPrice}|"></td>
                                    <td>
                                        <span class="text-warning" th:text="|${item.discountPercentage}%|"></span>
                                    </td>
                                    <td>
                                        <span class="text-info" th:text="|${item.vatPercentage}%|"></span>
                                    </td>
                                    <td>
                                        <strong class="text-success" th:text="|$${item.totalAmount}|"></strong>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(invoices)}" id="noInvoices" class="text-center py-5">
                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-3">No invoices found.</p>
            </div>
        </div>
    </div>
</div>
