spring.application.name=pharmacy-demo


#----------------------------db config

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}



#DB_PORT = ; DB_NAME =  ; DB_USERNAME=  ; DB_PASSWORD =

#----------------------hibernet configuration jap

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#enable patch method of rest
spring.mvc.hiddenmethod.filter.enabled=true



# Enable automatic restarts when classpath files change
spring.devtools.restart.enabled=true

# (Optional) Tell DevTools to watch additional folders outside the classpath if needed
# spring.devtools.restart.additional-paths=src/main/java

# Disable caching for Thymeleaf templates so UI changes show instantly without a restart
spring.thymeleaf.cache=false
